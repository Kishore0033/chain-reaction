<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chain Reaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<script src="/qrcode.js" defer></script>
<style>
:root{
  --stage:#2B3CF5; --stage-2:#3D4DFF; --stage-deep:#1C29C4;
  --card:#FFFFFF; --card-2:#EEF0FF; --text:#17134A; --muted:#5B5891;
  --outline:#17134A; --shadow:#17134A;
  --on-stage:#FFFFFF; --on-stage-muted:#CDD2FF;
  --sun:#FFD23F; --pop:#FF4F9A; --mint:#2FD38A; --sky:#4FC3FF; --danger:#FF5A4E;
  --on-accent:#17134A; --dots:rgba(255,255,255,.09);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#15104D; --stage-2:#1E1868; --stage-deep:#0C0933;
    --card:#241E72; --card-2:#2E2788; --text:#F5F3FF; --muted:#B9B3EE;
    --outline:#06041C; --shadow:#06041C;
    --on-stage:#FFFFFF; --on-stage-muted:#ABA5EA; --dots:rgba(255,255,255,.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --stage:#15104D; --stage-2:#1E1868; --stage-deep:#0C0933;
  --card:#241E72; --card-2:#2E2788; --text:#F5F3FF; --muted:#B9B3EE;
  --outline:#06041C; --shadow:#06041C;
  --on-stage:#FFFFFF; --on-stage-muted:#ABA5EA; --dots:rgba(255,255,255,.05);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  font-family:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.45;
  background-color:var(--stage);
  background-image:radial-gradient(var(--dots) 1.6px, transparent 1.8px);
  background-size:22px 22px;
  color:var(--on-stage);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:10px}
#app{max-width:1440px;margin:0 auto;padding:14px clamp(12px,2.4vw,28px) 48px}
h1,h2,h3{margin:0;line-height:1.05}
.muted{color:var(--muted)}
img{max-width:100%}

/* ---------- shared pieces ---------- */
.panel{background:var(--card);color:var(--text);border:3px solid var(--outline);border-radius:26px;box-shadow:0 8px 0 var(--shadow)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  font-weight:750;font-size:1rem;letter-spacing:-.005em;
  padding:.72em 1.25em;border:3px solid var(--outline);border-radius:16px;
  background:var(--sun);color:var(--on-accent);
  box-shadow:0 5px 0 var(--shadow);transition:transform .08s, box-shadow .08s;
  text-decoration:none;white-space:nowrap
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pop{background:var(--pop)}
.btn.mint{background:var(--mint)}
.btn.sky{background:var(--sky)}
.btn.danger{background:var(--danger);color:var(--on-accent)}
.btn.ghost{background:var(--card-2);color:var(--text)}
.btn.big{font-size:clamp(1.1rem,2vw,1.45rem);padding:.7em 1.4em;border-radius:20px}
.btn.huge{font-size:clamp(1.3rem,2.6vw,1.8rem);padding:.75em 1.6em;border-radius:22px}
.btn.sm{font-size:.9rem;padding:.5em .9em;border-radius:12px;box-shadow:0 3px 0 var(--shadow)}
.icon-btn{width:46px;height:46px;border-radius:14px;border:3px solid var(--outline);background:var(--card);color:var(--text);font-size:1.25rem;box-shadow:0 4px 0 var(--shadow);display:grid;place-items:center}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:.5em;padding:.45em .95em;border-radius:999px;border:3px solid var(--outline);background:var(--card);color:var(--text);font-weight:700;box-shadow:0 4px 0 var(--shadow)}
.pill .sub{font-weight:500;color:var(--muted);font-size:.9em}
.pill.clock{font-variant-numeric:tabular-nums;background:var(--sun);color:var(--on-accent);min-width:7.2em;justify-content:center}
.pill.clock.over{background:var(--pop);animation:throb 1s ease-in-out infinite}
.pill .count{background:var(--mint);color:var(--on-accent);border-radius:999px;padding:0 .5em;font-size:.85em}
@keyframes throb{50%{transform:scale(1.06)}}

/* chain links: the signature shape */
.link{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:52px;height:42px;padding:0 16px;
  border:3px solid var(--outline);border-radius:999px;
  background:var(--sun);color:var(--on-accent);
  font-weight:800;box-shadow:0 4px 0 var(--shadow);position:relative;
}
.link.c1{background:var(--pop)} .link.c2{background:var(--mint)} .link.c3{background:var(--sky)}
.joint{display:inline-block;width:16px;height:8px;background:var(--outline);border-radius:4px;margin:0 -3px;align-self:center;position:relative;z-index:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;font-stretch:88%}
.brand .lk{display:flex;align-items:center}
.brand .lk span:first-child,.brand .lk span:last-child{width:22px;height:14px;border:3px solid var(--on-stage);border-radius:999px}
.brand .lk span:nth-child(2){width:8px;height:4px;background:var(--on-stage);margin:0 -2px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.top .spacer{flex:1}

/* ---------- setup ---------- */
.hero{text-align:center;padding:clamp(18px,4vw,48px) 0 clamp(20px,3vw,36px)}
.titlechain{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:0;row-gap:16px}
.titlechain .link{height:auto;padding:.08em .5em .14em;font-size:clamp(2.8rem,9vw,7.2rem);letter-spacing:-.035em;font-stretch:80%;border-width:5px;box-shadow:0 10px 0 var(--shadow);line-height:1}
.titlechain .joint{width:clamp(26px,4vw,54px);height:clamp(10px,1.4vw,16px);margin:0 -6px}
.hero p{max-width:34em;margin:22px auto 0;font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--on-stage-muted)}
.hero p strong{color:var(--on-stage)}
.setup-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.setup-grid{grid-template-columns:1fr}}
.panel.pad{padding:clamp(18px,2.4vw,28px)}
.panel h2{font-size:1.55rem;letter-spacing:-.02em}
.panel .hint{margin:.35em 0 1em;color:var(--muted)}
.addrow{display:flex;gap:10px}
.addrow input{flex:1;min-width:0}
.field{width:100%;padding:.75em 1em;border:3px solid var(--outline);border-radius:14px;background:var(--card-2);color:var(--text);font-size:1.05rem}
.field::placeholder{color:var(--muted)}
.roster{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.roster li{display:flex;align-items:center;gap:10px;background:var(--card-2);border:3px solid var(--outline);border-radius:999px;padding:5px 8px 5px 5px}
.roster .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ava{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--outline);background:var(--c,#FFD23F);display:grid;place-items:center;font-size:1.4rem;position:relative;line-height:1}
button.ava{padding:0}
.ava .ph{position:absolute;right:-8px;bottom:-6px;font-size:.75rem;background:var(--mint);border:2px solid var(--outline);border-radius:999px;width:20px;height:20px;display:grid;place-items:center}
.x{border:none;background:none;font-size:1.2rem;color:var(--muted);width:32px;height:32px;border-radius:50%}
.x:hover{background:var(--card)}
.count-note{margin-top:14px;font-weight:600}
.count-note.ok{color:#14995F}
:root[data-theme="dark"] .count-note.ok{color:var(--mint)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .count-note.ok{color:var(--mint)}}
.rounds{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.rounds label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:3px solid var(--outline);background:var(--card-2);cursor:pointer}
.rounds input{width:22px;height:22px;margin-top:3px;accent-color:#FF4F9A;flex:none}
.rounds .rn{font-weight:750}
.rounds .rr{display:block;font-size:.92rem;color:var(--muted)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.settings label{display:grid;gap:4px;font-weight:650;font-size:.95rem}
.settings select{padding:.55em .7em;border:3px solid var(--outline);border-radius:12px;background:var(--card-2);color:var(--text)}
.start-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px}
.join-panel{margin-top:24px}
.join-panel .addrow input{text-transform:uppercase;letter-spacing:.2em;font-weight:800}
.setup-sub{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

/* ---------- home & lobby ---------- */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;max-width:1080px;margin:0 auto}
.home-grid.single{grid-template-columns:1fr;max-width:540px}
.hero.compact{padding:6px 0 22px}
.hero.compact .titlechain .link{font-size:clamp(2.2rem,8vw,3.8rem);border-width:4px;box-shadow:0 7px 0 var(--shadow)}
.hero.compact p{margin-top:14px}
.host-instead{text-align:center;margin-top:18px;color:var(--on-stage-muted)}
.host-instead button{background:none;border:none;color:var(--on-stage);font-weight:700;text-decoration:underline;padding:4px}
@media (min-width:901px){.invite{position:sticky;top:calc(14px + env(safe-area-inset-top,0px))}}
@media (max-width:480px){.top{gap:8px}.brand{font-size:1.05rem}.top .pill{padding:.4em .75em}}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
.home-grid .panel{display:flex;flex-direction:column;gap:14px}
.home-grid .grow{margin:0}
.home-grid h2{font-size:1.8rem}
.home-ic{font-size:2.6rem;line-height:1}
.formrow{display:grid;gap:6px;font-weight:650}
.code-field{text-transform:uppercase;letter-spacing:.3em;font-weight:800;font-size:1.4rem}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:44px;height:44px;border-radius:12px;border:3px solid var(--outline);background:var(--card-2);font-size:1.4rem;padding:0;display:grid;place-items:center;transition:transform .1s}
.emoji-pick button[aria-pressed="true"]{background:var(--sun);transform:scale(1.1);box-shadow:0 3px 0 var(--shadow)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.check input{width:20px;height:20px;margin-top:3px;accent-color:#FF4F9A;flex:none}
.lobby-grid{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:24px;align-items:start}
@media (max-width:900px){.lobby-grid{grid-template-columns:1fr}}
.lobby-side{display:grid;gap:24px}
.invite{text-align:center;padding:clamp(18px,2.4vw,28px)}
.invite h2{font-size:1.6rem}
.waiting{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:650;padding:16px 4px}
.waiting i{width:10px;height:10px;border-radius:50%;background:var(--pop);animation:bob 1s ease-in-out infinite;flex:none}
.waiting i:nth-child(2){animation-delay:.15s;background:var(--sun)}
.waiting i:nth-child(3){animation-delay:.3s;background:var(--mint)}
@keyframes bob{50%{transform:translateY(-8px)}}
.roster .nm{display:grid}
.roster .st{font-size:.78rem;color:var(--muted);font-weight:600}
.roster li.joined{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.lobby-tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:center}
details.manual{margin-top:16px}
details.manual summary{cursor:pointer;font-weight:650;color:var(--muted)}
details.manual .addrow{margin-top:10px}
.lobby-start{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:28px}
.you-tag{font-size:.72rem;font-weight:800;background:var(--sun);color:var(--on-accent);border:2px solid var(--outline);border-radius:999px;padding:0 .5em;margin-left:6px;vertical-align:middle}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:24px;align-items:start}
@media (max-width:960px){.play{grid-template-columns:1fr}.play .rail{order:2}}
.rail{padding:16px}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 4px 12px}
.rail-head h2{font-size:1.25rem}
.rail-head span{font-size:.82rem}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:18px;border:3px solid transparent;transition:transform .2s, background .2s}
.chip.cur{background:var(--sun);border-color:var(--outline);color:var(--on-accent);transform:scale(1.03);box-shadow:0 4px 0 var(--shadow)}
.chip.cur .meta{color:var(--on-accent)}
.chip.inactive{opacity:.55}
.chip .who{flex:1;min-width:0;display:grid}
.chip .nm{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .meta{font-size:.8rem;color:var(--muted);display:flex;gap:4px;align-items:center;min-height:1.2em}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.dot.on{background:var(--danger);border-color:var(--outline);opacity:1}
.chip .score{font-weight:800;font-size:1.5rem;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.cardbtn{width:38px;height:38px;border-radius:12px;border:3px solid var(--outline);background:var(--card-2);font-size:1.1rem;display:grid;place-items:center;padding:0;flex:none}
.cardbtn.used{opacity:.35;filter:grayscale(1)}

.stage{display:grid;gap:22px;min-width:0}
.rulebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;border-radius:20px;border:3px dashed var(--on-stage-muted);color:var(--on-stage)}
.rulebox .rl{color:var(--on-stage-muted);font-weight:600}
.rulebox strong{font-size:clamp(1.4rem,3vw,2.1rem);letter-spacing:-.02em}
.rulebox .letter{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--sun);color:var(--on-accent);border:3px solid var(--outline);box-shadow:0 4px 0 var(--shadow)}
.spot{display:flex;align-items:center;gap:clamp(18px,3vw,40px);flex-wrap:wrap}
.avawrap{position:relative;width:clamp(130px,15vw,180px);aspect-ratio:1;flex:none}
.bigava{position:absolute;inset:0;border-radius:50%;border:4px solid var(--outline);background:var(--c);display:grid;place-items:center;font-size:clamp(3.2rem,6vw,5rem);line-height:1;box-shadow:0 6px 0 var(--shadow)}
.sec{position:absolute;right:-6px;bottom:-4px;min-width:2.3em;height:2.3em;padding:0 .4em;border-radius:999px;background:var(--card);color:var(--text);border:3px solid var(--outline);display:grid;place-items:center;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--shadow)}
.spot-text{flex:1;min-width:240px}
.upnow{color:var(--on-stage-muted);font-weight:600;font-size:clamp(1rem,1.6vw,1.2rem)}
.pname{font-size:clamp(2.8rem,7vw,5.6rem);font-weight:800;letter-spacing:-.04em;font-stretch:82%;line-height:.95;margin:.08em 0 .14em;word-break:break-word}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:.4em;padding:.3em .8em;border-radius:999px;background:var(--pop);color:var(--on-accent);border:3px solid var(--outline);font-weight:750}
.next{display:flex;align-items:center;gap:8px;color:var(--on-stage-muted);font-weight:600}
.next b{color:var(--on-stage)}
.meter{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.meter .num{font-size:clamp(3.4rem,8vw,6rem);font-weight:800;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--sun)}
.meter .lbl{font-weight:700;font-size:1.2rem;padding-bottom:.35em}
.meter .hype{font-weight:800;font-size:clamp(1.1rem,2vw,1.5rem);padding-bottom:.3em;color:var(--pop)}
.meter .rec{margin-left:auto;padding-bottom:.4em;color:var(--on-stage-muted);font-weight:600}
.chainrow{display:flex;flex-wrap:wrap;align-items:center;row-gap:14px;min-height:46px}
.chainrow .link{min-width:46px;height:40px;font-size:.95rem;padding:0 12px}
.chainrow .link .w{display:none}
.chainrow.reveal .link .w{display:inline}
.chainrow.reveal .link .n{display:none}
.chainrow .link.new{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.empty-link{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;border:3px dashed var(--on-stage-muted);color:var(--on-stage-muted);font-weight:600}
.controls{padding:clamp(16px,2vw,24px)}
.controls .lbl{font-weight:700;display:block;margin-bottom:6px}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.inrow .field{flex:2;min-width:200px;font-size:1.25rem;font-weight:650}
.inrow #gestIn{flex:1;font-size:1.05rem}
.err{min-height:1.5em;margin:8px 0 4px;color:#D2283A;font-weight:650;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] .err{color:#FF8F98}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF8F98}}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.btnrow.main .btn{flex:1;min-width:180px}
.btnrow.small{margin-top:14px}
.float-pts{position:fixed;font-weight:800;font-size:2.4rem;color:var(--mint);-webkit-text-stroke:2px var(--outline);pointer-events:none;animation:floatup 1.1s ease-out forwards;z-index:60}
.float-pts.neg{color:var(--danger)}
@keyframes floatup{to{transform:translateY(-90px) scale(1.3);opacity:0}}

/* ---------- interstitial screens ---------- */
.center-screen{display:grid;place-items:center;min-height:70vh;text-align:center}
.intro-card{padding:clamp(24px,4vw,52px);max-width:760px;width:100%}
.intro-icon{font-size:clamp(4rem,10vw,6.5rem);line-height:1;display:block;margin-bottom:8px}
.intro-kicker{font-weight:700;color:var(--muted);font-size:1.1rem}
.intro-title{font-size:clamp(2.6rem,7vw,4.8rem);letter-spacing:-.04em;font-stretch:82%;margin:.1em 0 .2em}
.intro-rule{font-size:clamp(1.1rem,2vw,1.35rem);max-width:30em;margin:0 auto}
.slot{margin:22px auto 6px;max-width:520px;padding:18px 20px;border-radius:22px;border:4px solid var(--outline);background:var(--sun);color:var(--on-accent);font-weight:800;font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:-.02em;box-shadow:0 7px 0 var(--shadow);min-height:2.2em;display:grid;place-items:center}
.slot.spinning{background:var(--card-2);color:var(--text)}
.firstup{margin-top:22px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.intro-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,2vw,22px);margin:30px 0 8px;flex-wrap:wrap}
.pod{display:grid;justify-items:center;gap:8px}
.pod .ava{width:84px;height:84px;font-size:2.6rem}
.pod .nm{font-weight:800;font-size:1.2rem}
.pod .blk{width:clamp(90px,14vw,140px);border:3px solid var(--outline);border-radius:16px 16px 0 0;background:var(--sun);display:grid;place-items:center;font-weight:800;font-size:2rem;color:var(--on-accent)}
.pod:nth-child(1) .blk{height:110px;background:var(--sky)}
.pod:nth-child(2) .blk{height:150px}
.pod:nth-child(3) .blk{height:80px;background:var(--pop)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{border:3px solid var(--outline);border-radius:18px;padding:14px;background:var(--card-2)}
.stat b{display:block;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.stat span{color:var(--muted);font-weight:600;font-size:.95rem}
@media (max-width:560px){.stats{grid-template-columns:1fr}}
.reveal-box{margin:8px 0 18px}
.reveal-box .chainrow{justify-content:center}
.reveal-box .link{background:var(--sun)}
.story{font-size:clamp(1.3rem,3vw,2rem);font-weight:750;letter-spacing:-.02em;margin:12px auto;max-width:28em}
.board{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left}
.board li{display:grid;grid-template-columns:2.2em 44px 1fr auto;align-items:center;gap:10px;padding:6px 10px;border-radius:16px;background:var(--card-2);border:3px solid var(--outline)}
.board .rk{font-weight:800;font-size:1.2rem;text-align:center}
.board .bar{height:8px;border-radius:999px;background:var(--pop);margin-top:4px}
.board .pts{font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.board .nm{font-weight:750}

.awards-title{text-align:center;margin:10px 0 24px}
.awards-title h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.04em;font-stretch:82%}
.awards-title p{color:var(--on-stage-muted);font-size:1.2rem;margin:.4em 0 0}
.champ{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;padding:26px;margin:0 auto 24px;max-width:820px;background:var(--sun);color:var(--on-accent)}
.champ .ava{width:120px;height:120px;font-size:4rem;border-width:4px}
.champ h2{font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.03em}
.champ .k{font-weight:700;font-size:1.15rem}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;align-items:start}
@media (min-width:640px){.award.wide{grid-column:span 2}}
.award{padding:20px;display:grid;gap:6px;align-content:start;animation:dealin .55s cubic-bezier(.3,1.4,.5,1) both}
.award .ic{font-size:2.6rem;line-height:1}
.award h3{font-size:1.3rem;letter-spacing:-.01em}
.award .win{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;margin-top:6px}
.award .win .ava{width:40px;height:40px;font-size:1.3rem}
.award p{margin:0;color:var(--muted);font-size:.95rem}
.award .picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
@keyframes dealin{from{transform:translateY(40px) rotate(-4deg);opacity:0}}

/* ---------- modal, toasts, flash ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,8,40,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{width:min(640px,100%);padding:clamp(20px,3vw,32px);animation:popmodal .3s cubic-bezier(.3,1.5,.5,1);max-height:calc(100% - 20px);overflow-y:auto}
@keyframes popmodal{from{transform:scale(.85);opacity:0}}
.modal h2{font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:-.03em;margin-bottom:.2em}
.modal h3{font-size:1.1rem;margin:20px 0 10px}
.modal p{margin:.3em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.choice{padding:.5em .95em;border-radius:999px;border:3px solid var(--outline);background:var(--card-2);color:var(--text);font-weight:650}
.choice[aria-pressed="true"]{background:var(--pop);color:var(--on-accent)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}
.bigcard{display:flex;gap:16px;align-items:center;padding:16px;border-radius:20px;border:3px solid var(--outline);background:var(--sun);color:var(--on-accent);margin:12px 0}
.bigcard .ic{font-size:3rem;line-height:1}
.bigcard b{font-size:1.4rem;display:block}
.howto ol{padding-left:1.2em;margin:.4em 0}
.howto li{margin:.3em 0}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:grid;gap:10px;z-index:70;width:min(380px,calc(100% - 24px))}
.toast{background:var(--card);color:var(--text);border:3px solid var(--outline);border-radius:18px;box-shadow:0 6px 0 var(--shadow);padding:12px 14px;font-weight:650;animation:slidein .3s ease-out}
.toast .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
#flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:65}
#flash .fl{background:var(--pop);color:var(--on-accent);border:5px solid var(--outline);border-radius:30px;box-shadow:0 12px 0 var(--shadow);padding:24px 40px;text-align:center;animation:flashin 1.8s cubic-bezier(.3,1.5,.5,1) forwards;max-width:90vw}
#flash .fl b{display:block;font-size:clamp(2.2rem,6vw,4.4rem);letter-spacing:-.03em;line-height:1}
#flash .fl span{display:block;font-weight:700;font-size:clamp(1rem,2.2vw,1.4rem);margin-top:8px}
@keyframes flashin{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.05);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
.qrwrap{background:#fff;border:3px solid var(--outline);border-radius:20px;padding:10px;width:min(300px,72vw);margin:14px auto 6px;box-shadow:0 6px 0 var(--shadow)}
.qrwrap svg{width:100%;height:auto;display:block}
.bigcode{font-size:clamp(2.6rem,8vw,3.6rem);font-weight:800;letter-spacing:.22em;text-align:center;line-height:1;margin:6px 0 10px}
.joinurl{text-align:center;word-break:break-all}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.pause-veil{position:fixed;inset:0;background:rgba(10,8,40,.72);display:grid;place-items:center;z-index:45;text-align:center}
.pause-veil h2{font-size:clamp(3rem,10vw,6rem);letter-spacing:-.04em;margin-bottom:20px;color:#fff}

/* ---------- phone (player) view ---------- */
.phone{max-width:520px;margin:0 auto;display:grid;gap:16px}
.status{padding:24px 20px;text-align:center}
.status.mine{background:var(--pop);color:var(--on-accent);animation:throb 1.2s ease-in-out infinite}
.status.soon{background:var(--sun);color:var(--on-accent)}
.status .big{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0}
.status .ava{margin:0 auto;width:72px;height:72px;font-size:2.4rem}
.mystats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mystats .stat{background:var(--card);color:var(--text);text-align:center}
.mystats .stat b{font-size:2rem}
.phone .btn{width:100%}
.keeper-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;counter-reset:w}
.keeper-list li{counter-increment:w;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--card-2);border:2px solid var(--outline);font-weight:700;font-size:1.2rem}
.keeper-list li::before{content:counter(w);min-width:1.8em;text-align:center;font-size:.85rem;background:var(--sun);color:var(--on-accent);border-radius:999px;border:2px solid var(--outline)}
.keeper-list li.last{background:var(--mint);color:var(--on-accent)}
.keeper-list .g{font-weight:500;font-size:.9rem;opacity:.8}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pick-grid button{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;border:3px solid var(--outline);background:var(--card-2);color:var(--text);font-weight:750;text-align:left}

/* ================= extra game-show polish ================= */
:root{ --beam1:rgba(255,255,255,.16); --beam2:rgba(255,79,154,.18); --rays:rgba(255,210,63,.32); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --beam1:rgba(255,255,255,.07); --beam2:rgba(255,79,154,.12); --rays:rgba(255,210,63,.2); } }
:root[data-theme="dark"]{ --beam1:rgba(255,255,255,.07); --beam2:rgba(255,79,154,.12); --rays:rgba(255,210,63,.2); }
body::before{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 22% 60% at 28% 0%, var(--beam1), transparent 70%),radial-gradient(ellipse 22% 60% at 72% 0%, var(--beam2), transparent 70%);
  animation:beams 12s ease-in-out infinite alternate}
@keyframes beams{from{transform:rotate(-5deg) translateX(-4%)}to{transform:rotate(5deg) translateX(4%)}}
#app{position:relative;z-index:1}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.floaties span{position:absolute;left:var(--x);bottom:-70px;font-size:clamp(1.4rem,2.4vw,2.2rem);opacity:.32;animation:drift var(--d) linear infinite;animation-delay:var(--del)}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-125vh) rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* mascot */
.mascot{display:inline-block;width:var(--ms,110px);line-height:0;vertical-align:middle}
.mascot svg{width:100%;height:auto;overflow:visible;display:block}
.m-back-o{fill:none;stroke:var(--outline);stroke-width:15}
.m-back{fill:none;stroke:var(--pop);stroke-width:8}
.m-front{fill:var(--sun);stroke:var(--outline);stroke-width:4.5}
.m-eye{fill:#17134A;transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.m-eye + .m-eye{animation-delay:.03s}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.m-shine{fill:#fff}
.m-cheek{fill:#FF4F9A;opacity:.55}
.m-mouth{display:none;fill:none;stroke:#17134A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.m-grin,.m-wow{fill:#17134A}
.mascot[data-mood="idle"] .m-smile,.mascot[data-mood="happy"] .m-grin,.mascot[data-mood="wow"] .m-wow,.mascot[data-mood="sad"] .m-sad{display:inline}
.mascot .m-body{transform-box:view-box;transform-origin:45px 96px;animation:mbob 2.4s ease-in-out infinite}
.mascot[data-mood="happy"] .m-body{animation:mjump .62s cubic-bezier(.3,1.6,.5,1) 3,mbob 2.4s ease-in-out 1.9s infinite}
.mascot[data-mood="wow"] .m-body{animation:mjump .62s cubic-bezier(.3,1.6,.5,1) 2,mbob 2.4s ease-in-out 1.3s infinite}
.mascot[data-mood="sad"] .m-body{animation:mshake .45s ease-in-out 3,mbob 2.4s ease-in-out 1.4s infinite}
@keyframes mbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.02,.98)}}
@keyframes mjump{0%{transform:translateY(0) scale(1.12,.88)}40%{transform:translateY(-24px) scale(.94,1.06) rotate(-7deg)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes mshake{0%,100%{transform:none}25%{transform:translateX(-7px) rotate(-7deg)}75%{transform:translateX(7px) rotate(7deg)}}
.mascot-wrap{display:flex;align-items:center;gap:10px;position:relative}
.meter .mascot{--ms:96px}
.bubble{position:relative;background:var(--card);color:var(--text);border:3px solid var(--outline);border-radius:16px;padding:.35em .8em;font-weight:800;box-shadow:0 4px 0 var(--shadow);opacity:0;transform:scale(.6) translateX(10px);transition:opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;right:-11px;top:50%;width:14px;height:14px;background:var(--card);border-right:3px solid var(--outline);border-top:3px solid var(--outline);transform:translateY(-50%) rotate(45deg)}
.hero-mascot{display:flex;justify-content:center;margin-bottom:6px}
.hero-mascot .mascot{--ms:clamp(90px,11vw,130px)}

/* spotlight rays */
.avawrap{isolation:isolate}
.avawrap::before{content:"";position:absolute;inset:-34%;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(var(--rays) 0deg 9deg, transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 30%, transparent 68%);mask:radial-gradient(circle, #000 30%, transparent 68%);
  animation:spin 22s linear infinite}
.bigava{animation:avabob 2.6s ease-in-out infinite}
@keyframes avabob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.sec{z-index:2;animation:throb 1.8s ease-in-out infinite}
.pname{animation:namepop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes namepop{from{transform:translateY(18px) scale(.85);opacity:0}}
.upnow,.next{animation:fadeup .5s ease-out both}
.next{animation-delay:.12s}
@keyframes fadeup{from{transform:translateY(8px);opacity:0}}

/* chain shimmer + sparks */
.chainrow .link{overflow:hidden}
.chainrow .link::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * .12s);pointer-events:none}
@keyframes shine{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.spark{position:fixed;z-index:85;pointer-events:none;font-size:20px;font-weight:800;transform:translate(-50%,-50%);animation:spark .8s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes spark{to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2) rotate(200deg);opacity:0}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:44;box-shadow:inset 0 0 180px 50px rgba(255,60,60,.65);animation:vig .9s ease-out forwards}
@keyframes vig{from{opacity:1}to{opacity:0}}

/* buttons */
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s ease;pointer-events:none;z-index:1}
.btn:hover:not(:disabled)::after{left:135%}
.btn.huge:not(:disabled){animation:breathe 2.4s ease-in-out infinite}
.btn.huge:active{animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}
.btn.mint.big:hover:not(:disabled),.btn.danger.big:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--shadow)}

/* rail + drag & drop */
.chip.cur{animation:glow 1.6s ease-in-out infinite}
.chip.cur .ava{animation:avabob 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--shadow),0 0 0 7px rgba(255,210,63,.35)}}
.score.up{animation:bumpup .8s ease-out}
.score.down{animation:bumpdown .8s ease-out}
@keyframes bumpup{30%{transform:scale(1.7);color:#2FD38A}}
@keyframes bumpdown{30%{transform:scale(1.5) rotate(-8deg);color:#FF5A4E}}
.grip{flex:none;width:22px;height:36px;border:none;border-radius:8px;padding:0;cursor:grab;touch-action:none;
  background-color:transparent;background-image:radial-gradient(circle, currentColor 1.7px, transparent 2.1px);background-size:8px 8px;background-position:3px 2px;
  color:var(--muted);opacity:.75;transition:opacity .15s, background-color .15s}
.grip:hover,.grip:focus-visible{opacity:1;background-color:rgba(127,127,160,.16)}
.chip.cur .grip{color:var(--on-accent)}
.dragging{z-index:95!important;cursor:grabbing;pointer-events:none;background:var(--card)!important;color:var(--text)!important;border-color:var(--outline)!important;
  box-shadow:0 12px 0 var(--shadow),0 22px 40px rgba(0,0,0,.35)!important;transform:rotate(-2deg) scale(1.05)!important;animation:none!important;transition:none!important}
.drop-ph{list-style:none;border:3px dashed var(--muted);border-radius:18px;background:rgba(127,127,160,.08);animation:phpulse 1s ease-in-out infinite}
@keyframes phpulse{50%{background:rgba(127,127,160,.18)}}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.rail-head{flex-wrap:wrap}

/* screens */
.intro-card{animation:cardin .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardin{from{transform:translateY(30px) scale(.92);opacity:0}}
.intro-icon{display:inline-block;position:relative;isolation:isolate;animation:iconpop .7s cubic-bezier(.3,1.7,.5,1) both,iconbob 2.6s ease-in-out .7s infinite}
.intro-icon::before{content:"";position:absolute;inset:-70%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(var(--rays) 0deg 9deg, transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 25%,transparent 66%);animation:spin 20s linear infinite}
@keyframes iconpop{from{transform:scale(0) rotate(-30deg)}}
@keyframes iconbob{50%{transform:translateY(-8px) rotate(4deg)}}
.titlechain .link{transform-origin:50% 0;animation:swing 2.8s ease-in-out infinite alternate}
.titlechain .link.c1{animation-delay:-1.4s}
@keyframes swing{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.board li{animation:rowin .45s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rowin{from{transform:translateX(-24px);opacity:0}}
.board .bar{transform-origin:left;animation:grow 1s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0) * 70ms + .2s)}
@keyframes grow{from{transform:scaleX(0)}}
.hoppers{display:flex;gap:6px;font-size:1.6rem}
.hoppers span{animation:hop 1.2s ease-in-out infinite}
.hoppers span:nth-child(2){animation-delay:.15s}.hoppers span:nth-child(3){animation-delay:.3s}.hoppers span:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px) rotate(-10deg)}}
.waiting{flex-wrap:wrap}
.waiting .mascot{--ms:84px}
.champ{position:relative;overflow:hidden;isolation:isolate;padding-top:44px!important}
.champ::before{content:"";position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;z-index:-1;background:repeating-conic-gradient(rgba(255,255,255,.35) 0deg 8deg, transparent 8deg 16deg);animation:spin 30s linear infinite}
.champ-ava{position:relative;display:inline-block}
.champ-ava .crown{position:absolute;left:50%;top:-30px;z-index:2;font-size:2.6rem;transform:translateX(-50%);animation:crown 1.6s ease-in-out infinite}
@keyframes crown{50%{transform:translateX(-50%) translateY(-8px) rotate(8deg)}}
.award .ic{display:inline-block;animation:iconbob 2.8s ease-in-out infinite}
.awards-title .mascot{--ms:120px;margin-bottom:6px}
#flash .fl{position:relative;isolation:isolate;overflow:visible}
#flash .fl::before{content:"";position:absolute;inset:-60% -30%;z-index:-1;background:repeating-conic-gradient(rgba(255,210,63,.45) 0deg 8deg, transparent 8deg 16deg);-webkit-mask:radial-gradient(closest-side,#000 40%,transparent);mask:radial-gradient(closest-side,#000 40%,transparent);animation:spin 6s linear infinite}
.status.mine{position:relative;overflow:hidden;isolation:isolate}
.status.mine::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:-1;background:repeating-conic-gradient(rgba(255,255,255,.3) 0deg 9deg, transparent 9deg 18deg);animation:spin 14s linear infinite}
.status .mascot{--ms:96px;margin:0 auto 6px}
@media (prefers-reduced-motion: reduce){ .floaties{display:none} body::before{animation:none} }

.plist .chip.joined{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.roster li .grip{margin-left:-2px}

/* results page: winner, then top three, then full standings */
.reveal{animation:revealin .8s cubic-bezier(.3,1.3,.5,1) both}
.reveal.r1{animation-delay:.25s}.reveal.r2{animation-delay:1.5s}.reveal.r3{animation-delay:2.7s}.reveal.r4{animation-delay:3.4s}
@keyframes revealin{from{transform:translateY(40px) scale(.94);opacity:0}}
.results-sec{max-width:980px;margin:0 auto 28px}
.sec-title{text-align:center;font-size:clamp(1.6rem,3.6vw,2.4rem);letter-spacing:-.03em;margin-bottom:14px;color:var(--on-stage)}
.champ .k.big{font-size:1.4rem}
.big-podium{margin:6px 0 0;gap:clamp(8px,2vw,24px)}
.big-podium .pod{gap:6px;min-width:0}
.big-podium .pod .ava{width:clamp(70px,9vw,104px);height:clamp(70px,9vw,104px);font-size:clamp(2.2rem,4.4vw,3.4rem);animation:dropin .6s cubic-bezier(.3,1.6,.5,1) both}
.big-podium .pod .nm{font-size:clamp(1rem,2vw,1.35rem);color:var(--on-stage);max-width:min(30vw,190px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big-podium .pod .pp{font-weight:700;color:var(--on-stage-muted)}
.big-podium .pod-medal{font-size:2rem;line-height:1;animation:dropin .6s cubic-bezier(.3,1.6,.5,1) both}
.big-podium .blk{width:clamp(96px,18vw,190px);font-size:clamp(2.2rem,5vw,3.4rem);box-shadow:0 6px 0 var(--shadow);transform-origin:bottom;animation:rise .8s cubic-bezier(.3,1.3,.5,1) both}
.big-podium .p1 .blk{height:clamp(130px,18vw,190px);background:var(--sun)}

.agrid.small .award{padding:16px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal panel" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="flash" aria-live="assertive"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
"use strict";
/* ================= data ================= */
const ROUNDS = [
  {id:'warmup', icon:'🔥', name:'Warm-up', rule:'Any word goes. Say the whole chain, then add yours.'},
  {id:'theme',  icon:'🎯', name:'Theme round', rule:'Every new word has to fit the theme.'},
  {id:'alpha',  icon:'🔤', name:'Alphabet round', rule:'Your word must start with the last letter of the word before it.'},
  {id:'action', icon:'🕺', name:'Action round', rule:'Every word comes with a gesture. Repeat the words and the moves!'},
  {id:'story',  icon:'📖', name:'Story round', rule:'The words must build one silly sentence, in order.'},
  {id:'finale', icon:'👑', name:'Grand finale', rule:'Top 3 only. One mistake and you’re out. Last one standing wins.'}
];
const THEMES = ['Office stuff','Food & snacks','Movies','Countries','Animals','Corporate jargon','Things in a kitchen','Sports','Things at the beach','Jobs','Things that are yellow','Superpowers','Things in a meeting room','Holiday destinations'];
const CARDS = {
  lifeline:{icon:'🛟', name:'Lifeline', desc:'A teammate may whisper one forgotten word to you.', when:'own'},
  skip:    {icon:'⏭️', name:'Skip', desc:'Pass your turn with no penalty. The chain moves on.', when:'own'},
  reverse: {icon:'🔄', name:'Reverse', desc:'Flip the direction of play.', when:'any'},
  twister: {icon:'🌀', name:'Tongue twister', desc:'The next player must add a tricky word the game picks.', when:'any'},
  freeze:  {icon:'🙈', name:'Freeze', desc:'The next player takes their turn with eyes closed.', when:'any'}
};
const TWISTERS = ['Procrastination','Onomatopoeia','Hippopotamus','Worcestershire','Quintessential','Rhythm','Pneumonia','Spreadsheet-ception','Antidisestablishment','Otorhinolaryngologist','Phenomenon','Squirrel','Anemone','Particularly','Synergistically'];
const PENALTIES = [
  'Say your next turn like a news reporter 📺',
  'Do a 3-second victory dance 💃',
  'Give the person on your left a compliment 💐',
  'Narrate your next turn like a sports commentator 🎙️',
  'Announce “I am the chain breaker!” in a superhero voice 🦸',
  'Do your best robot moves for 3 seconds 🤖',
  'Whisper your entire next turn 🤫',
  'Take a bow while everyone applauds 👏',
  'Say your next turn in slow motion 🐢',
  'Strike a superhero pose until your next turn 💪'
];
const REASONS = [
  {id:'missed', label:'Missed a word'}, {id:'order', label:'Wrong order'}, {id:'slow', label:'Got stuck'},
  {id:'repeat', label:'Repeated a word'}, {id:'nonew', label:'No new word'}, {id:'rule', label:'Broke the round rule'}
];
const COLORS = ['#FF4F9A','#FFD23F','#2FD38A','#4FC3FF','#FF8A3D','#B57BFF','#FF6B6B','#00C9B7','#F9A8D4','#A3E35B','#FFB4A2','#7CC6FE'];
const EMOJIS = ['🦊','🐼','🐙','🦄','🐸','🐯','🐧','🦁','🐨','🐵','🦉','🐝','🐳','🦖','🐢','🦩'];
const KEY = 'chainReaction.v1', PKEY = 'chainReaction.player', MKEY = 'chainReaction.muted';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s || '').replace(/[\u0000-\u001F\u007F\u200B-\u200F\u2028-\u202E\u2060-\u206F]/g,'').trim();
const rand = a => a[Math.floor(Math.random()*a.length)];
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
const fmt = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2,8);
function genCode(){ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

/* ================= state ================= */
function freshState(players){
  return {
    phase:'home', players: players || [], kicked:[],
    settings:{ roundMin:6, base:6, perWord:1.5, strikeLimit:3, rounds:ROUNDS.map(r=>r.id) },
    roundList:[], ri:0, theme:'', chain:[], cur:0, dir:1,
    forcedNext:null, forcedNow:null, freezeNext:false, frozenNow:false,
    turnEndsAt:0, roundEndsAt:null, paused:false, pTurn:0, pRound:null, roundOver:false, timeoutFired:false,
    record:{len:0, round:''}, rstats:{longest:0, words:0, strikes:0}, lastChain:[], lastBroken:null,
    finalists:[], champion:null, wordsmith:null, code:'', ev:{id:0,t:'',x:''}, beatRecord:false, savedAt:0
  };
}
let S;
try { S = JSON.parse(lsGet(KEY)); } catch(e){ S = null; }
if (!S || !S.settings || !Array.isArray(S.players)) S = freshState();
if (S.phase === 'setup') S.phase = S.code ? 'lobby' : 'home';
if (!Array.isArray(S.kicked)) S.kicked = [];
if (S.phase === 'play') {
  // coming back after a refresh: hold the game until the host resumes
  const left = S.paused ? S.pRound : (S.roundEndsAt ? Math.max(0, S.roundEndsAt - (S.savedAt||Date.now())) : null);
  S.paused = true; S.pRound = left; S.pTurn = turnLimit()*1000; S.timeoutFired = false;
}
let muted = lsGet(MKEY) === '1';
let undoStack = [];
let draft = '', draftG = '';
let modalOpen = false;
let peekTimer = null;
let newLinkIndex = -1;

function save(){
  S.savedAt = Date.now();
  lsSet(KEY, JSON.stringify(S));
  broadcast();
}
function snapshot(){ undoStack.push(JSON.stringify(S)); if (undoStack.length > 15) undoStack.shift(); }
function setEv(t, x){ S.ev = {id:(S.ev?.id||0)+1, t, x: clean(x).slice(0,140)}; }

const curRound = () => ROUNDS.find(r => r.id === S.roundList[S.ri]);
const isFinale = () => curRound()?.id === 'finale';
const eligible = p => isFinale() ? (S.finalists.includes(p.id) && !p.out) : !p.judge;
const curPlayer = () => S.players[S.cur];
function nextIdx(from, dir = S.dir){
  const n = S.players.length;
  for (let k = 1; k <= n; k++){ const i = ((from + dir*k) % n + n) % n; if (eligible(S.players[i])) return i; }
  return -1;
}
const nextPlayer = () => { const i = nextIdx(S.cur); return i >= 0 && i !== S.cur ? S.players[i] : null; };
const eligibleCount = () => S.players.filter(eligible).length;
function turnLimit(){ return Math.round(S.settings.base + S.settings.perWord * S.chain.length); }
const byId = id => S.players.find(p => p.id === id);
function lastLetter(w){ const s = w.toLowerCase().replace(/[^a-z]/g,''); return s ? s[s.length-1] : ''; }
function needLetter(){ return S.chain.length ? lastLetter(S.chain[S.chain.length-1].w) : ''; }
function hypeText(n){
  if (n >= 25) return 'Is this even humanly possible?! 🤯';
  if (n >= 20) return 'Legendary territory 🏛️';
  if (n >= 15) return 'Unbreakable! 💪';
  if (n >= 10) return 'Double digits, double points ⚡';
  if (n >= 5)  return 'Heating up 🔥';
  return '';
}

/* ================= sound ================= */
let AC = null;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type='sine', v=.15, when=0){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); const t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+.015); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
}
const SFX = {
  ok(){ [523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.06)); },
  strike(){ tone(220,.4,'sawtooth',.18); tone(155,.55,'sawtooth',.16,.14); },
  tick(){ tone(1100,.06,'square',.05); },
  buzz(){ tone(660,.12,'square',.12); tone(880,.12,'square',.12,.13); },
  whoosh(){ [392,523,659].forEach((f,i)=>tone(f,.2,'sine',.12,i*.05)); },
  card(){ [784,988,1319].forEach((f,i)=>tone(f,.14,'triangle',.13,i*.05)); },
  fanfare(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i===6?.6:.18,'triangle',.17,i*.13)); },
  spin(){ tone(1500,.03,'square',.035); }
};

/* ================= confetti, flash, toasts ================= */
function confetti(n = 160){
  if (RM) return;
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols = ['#FFD23F','#FF4F9A','#2FD38A','#4FC3FF','#FFFFFF'];
  const ps = Array.from({length:n}, () => ({x:innerWidth/2 + (Math.random()-.5)*200, y:innerHeight*.35, vx:(Math.random()-.5)*16, vy:-Math.random()*15-4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*8, h:8+Math.random()*10, c:rand(cols)}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}
function flash(big, small=''){
  const f = $('#flash'); f.innerHTML = `<div class="fl"><b>${esc(big)}</b>${small?`<span>${esc(small)}</span>`:''}</div>`;
  clearTimeout(flash.t); flash.t = setTimeout(()=> f.innerHTML='', 1900);
}
function toast(html, actions = [], ms = 7000){
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = html;
  if (actions.length){ const a = document.createElement('div'); a.className='acts';
    actions.forEach(([label, fn, cls]) => { const b = document.createElement('button'); b.className = 'btn sm '+(cls||''); b.textContent = label; b.onclick = () => { el.remove(); fn(); }; a.appendChild(b); });
    el.appendChild(a); }
  $('#toasts').appendChild(el); setTimeout(()=> el.remove(), ms);
}
function floatPts(txt, neg){
  const r = document.querySelector('.avawrap')?.getBoundingClientRect(); if (!r) return;
  const el = document.createElement('div'); el.className = 'float-pts'+(neg?' neg':''); el.textContent = txt;
  el.style.left = (r.left + r.width*.62)+'px'; el.style.top = (r.top + 10)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(), 1200);
}
function slotSpin(el, items, final, onDone, steps = 18){
  if (RM){ el.textContent = final; onDone && onDone(); return; }
  el.classList.add('spinning'); let i = 0;
  (function step(){
    if (i >= steps){ el.textContent = final; el.classList.remove('spinning'); onDone && onDone(); return; }
    el.textContent = items[i % items.length]; SFX.spin(); i++;
    setTimeout(step, 45 + i*i*0.9);
  })();
}

/* ================= game flow ================= */
function startGame(){
  if (S.players.length < 2) return;
  const deck = Object.keys(CARDS);
  S.players.forEach(p => Object.assign(p, {score:0, ts:0, rs:0, judge:false, out:false, catches:0, succ:0, card:rand(deck), cardUsed:false}));
  S.roundList = ROUNDS.filter(r => S.settings.rounds.includes(r.id)).map(r => r.id);
  if (!S.roundList.length) S.roundList = ['warmup'];
  Object.assign(S, {ri:0, record:{len:0,round:''}, champion:null, wordsmith:null, finalists:[], dir:1, lastChain:[], lastBroken:null});
  if (!S.code) S.code = genCode();
  undoStack = [];
  ac();
  beginRoundIntro();
  hostConnect();
}
function beginRoundIntro(){
  const rd = curRound();
  S.chain = []; S.dir = 1; S.roundOver = false; S.forcedNext = S.forcedNow = null; S.freezeNext = S.frozenNow = false;
  S.rstats = {longest:0, words:0, strikes:0}; S.lastBroken = null; S.paused = false;
  S.players.forEach(p => { p.rs = 0; p.judge = false; p.out = false; });
  if (rd.id === 'finale'){
    const ranked = [...S.players].sort((a,b) => b.score - a.score || a.ts - b.ts);
    S.finalists = ranked.slice(0, Math.min(3, ranked.length)).map(p => p.id);
    // lowest-ranked finalist goes first
    S.cur = S.players.findIndex(p => p.id === S.finalists[S.finalists.length-1]);
    S.phase = 'finaleIntro';
  } else {
    if (rd.id === 'theme') S.theme = rand(THEMES);
    S.cur = S.ri % S.players.length;
    S.phase = 'intro';
  }
  setEv('round', `${rd.name} is starting`);
  save(); render();
  if (rd.id === 'theme'){ const el = $('#slot'); if (el) slotSpin(el, THEMES, S.theme, () => SFX.card()); }
}
function startPlay(){
  ac();
  S.phase = 'play'; S.chain = []; S.paused = false;
  S.roundEndsAt = isFinale() ? null : Date.now() + S.settings.roundMin*60000;
  startTurn();
  setEv('go', `${curRound().name}: go!`);
  save(); render(); SFX.whoosh();
  flash(`${curRound().icon} Go!`, `${curPlayer().name} starts the chain`);
}
function startTurn(){
  S.forcedNow = S.forcedNext; S.forcedNext = null;
  S.frozenNow = S.freezeNext; S.freezeNext = false;
  S.turnEndsAt = Date.now() + turnLimit()*1000; S.timeoutFired = false;
  draft = S.forcedNow || ''; draftG = '';
  lastTickSec = null;
}
function advance(){
  if (S.roundOver && !isFinale()) return endRound();
  const ni = nextIdx(S.cur);
  if (ni < 0) return endRound();
  S.cur = ni; startTurn(); save(); render();
}
function success(force = false){
  const inp = $('#wordIn'); const word = clean(inp ? inp.value : draft).slice(0, 40);
  const gest = clean($('#gestIn')?.value || '').slice(0, 40);
  const rd = curRound(); const p = curPlayer();
  if (!word){ setErr('Type the word they added, then tap Nailed it.'); inp && inp.focus(); return; }
  if (!force && S.chain.some(c => norm(c.w) === norm(word))){
    setErr(`“${esc(word)}” is already in the chain.`, [['Give a strike', () => openStrike('repeat'), 'danger'], ['Allow it', () => success(true), 'ghost']]); return;
  }
  if (!force && rd.id === 'alpha' && S.chain.length){
    const need = needLetter(), got = word.toLowerCase().replace(/[^a-z]/g,'')[0];
    if (need && got && got !== need){ setErr(`It needs to start with “${need.toUpperCase()}”.`, [['Give a strike', () => openStrike('rule'), 'danger'], ['Allow it', () => success(true), 'ghost']]); return; }
  }
  snapshot();
  S.chain.push({w:word, g:gest, by:p.id});
  const len = S.chain.length, pts = len >= 10 ? 2 : 1;
  p.score += pts; p.succ++;
  S.rstats.words++; S.rstats.longest = Math.max(S.rstats.longest, len);
  newLinkIndex = len - 1;
  SFX.ok(); floatPts('+'+pts); cheer('happy', len >= 5 && len % 5 === 0 ? hypeText(len) : rand(OK_LINES));
  if (len > S.record.len){
    S.record = {len, round: rd.name};
    if (len >= 4 && !S.beatRecord){ S.beatRecord = true; cheer('wow', 'New record! 🏆', 2200); setTimeout(()=>{ flash('New team record! 🏆', `${len} links and counting`); confetti(120); SFX.fanfare(); }, 250); }
  } else if ([5,10,15,20,25,30].includes(len)){ setTimeout(()=> flash(hypeText(len)), 200); }
  setEv('ok', `${p.name} added a word (+${pts}). Chain: ${len}`);
  draft = ''; draftG = '';
  advance();
  requestAnimationFrame(() => sparkle(document.querySelector('#chainRow .link.new')));
}
function applyStrike(reasonId, catcherId){
  snapshot();
  const p = curPlayer(), len = S.chain.length, fin = isFinale();
  S.lastBroken = {len, by:p.id, words:S.chain.slice()};
  p.ts++; S.rstats.strikes++;
  if (fin){ p.out = true; }
  else { p.score -= 2; p.rs++; if (p.rs >= S.settings.strikeLimit) p.judge = true; }
  const c = catcherId && byId(catcherId);
  if (c){ c.score += 1; c.catches++; }
  S.chain = []; S.beatRecord = false; newLinkIndex = -1;
  SFX.strike(); fxStrike(); cheer('sad', rand(STRIKE_LINES), 2600);
  const reason = REASONS.find(r => r.id === reasonId)?.label || 'Mistake';
  setEv('strike', `${p.name} snapped the chain at ${len}. ${reason}.`);
  if (fin && eligibleCount() <= 1){
    const w = S.players.find(eligible); if (w){ S.champion = w.id; w.score += 5; }
  }
  save();
  return {p, len, fin, c};
}
function continueAfterStrike(){
  closeModal();
  if (S.champion && isFinale()) return finishGame();
  if (S.paused){ S.paused = false; if (S.pRound != null && S.roundEndsAt) S.roundEndsAt = Date.now() + S.pRound; }
  if ((S.roundOver && !isFinale()) || eligibleCount() < 2) return endRound();
  if (!eligible(curPlayer())) S.cur = nextIdx(S.cur);
  startTurn(); save(); render();
}
function endRound(){
  closeModal();
  S.lastChain = S.chain.length ? S.chain.slice() : (S.lastBroken?.words || []);
  S.rstats.longest = Math.max(S.rstats.longest, S.chain.length);
  S.phase = 'roundEnd'; S.paused = false; S.beatRecord = false; newLinkIndex = -1;
  setEv('roundEnd', `${curRound().name} complete`);
  save(); render(); SFX.whoosh();
}
function nextRound(){
  S.ri++;
  if (S.ri >= S.roundList.length) return finishGame();
  beginRoundIntro();
}
function finishGame(){
  closeModal();
  S.champion = rankedPlayers()[0]?.id || null;
  S.phase = 'awards';
  setEv('awards', `${byId(S.champion)?.name || 'Someone'} is the champion!`);
  save(); render(); SFX.fanfare(); setTimeout(()=>confetti(220), 400); setTimeout(()=>{ confetti(180); SFX.fanfare(); }, 2400);
}
function pause(){
  if (S.paused) return;
  const now = Date.now();
  S.paused = true; S.pTurn = Math.max(0, S.turnEndsAt - now); S.pRound = S.roundEndsAt ? Math.max(0, S.roundEndsAt - now) : null;
  save();
}
function resume(){
  if (!S.paused) return;
  const now = Date.now();
  S.paused = false; S.turnEndsAt = now + (S.pTurn || turnLimit()*1000);
  if (S.pRound != null && S.roundEndsAt != null) S.roundEndsAt = now + S.pRound;
  if (S.timeoutFired){ S.turnEndsAt = now + 5000; S.timeoutFired = false; }
  save(); render();
}
function useCard(pid){
  const p = byId(pid); if (!p || p.cardUsed) return;
  const card = CARDS[p.card];
  if (card.when === 'own' && curPlayer()?.id !== p.id) return;

const grip = name => `<button type="button" class="grip" aria-label="Move ${esc(name)}. Drag, or use the arrow keys."></button>`;

let drag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('.grip');
  if (!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const item = g.closest('[data-pid]'), list = item && item.parentElement;
  if (!item || !list) return;
  e.preventDefault();
  const r = item.getBoundingClientRect();
  const ph = document.createElement(item.tagName);
  ph.className = 'drop-ph'; ph.style.height = r.height + 'px';
  list.insertBefore(ph, item);
  const oldStyle = item.getAttribute('style');
  Object.assign(item.style, {position:'fixed', left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px', margin:'0'});
  item.classList.add('dragging'); document.body.classList.add('is-dragging');
  drag = {item, list, ph, oldStyle, dx:e.clientX - r.left, dy:e.clientY - r.top, grid:list.classList.contains('roster'), pid:item.dataset.pid};
  try { g.setPointerCapture(e.pointerId); } catch(_){}
  SFX.spin();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.item.style.left = (e.clientX - drag.dx) + 'px';
  drag.item.style.top = (e.clientY - drag.dy) + 'px';
  for (const s of drag.list.children){
    if (s === drag.item || s === drag.ph || !s.dataset.pid) continue;
    const b = s.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) continue;
    const before = drag.grid ? e.clientX < b.left + b.width/2 : e.clientY < b.top + b.height/2;
    const ref = before ? s : s.nextSibling;
    if (ref !== drag.ph){ drag.list.insertBefore(drag.ph, ref); SFX.spin(); }
    break;
  }
  if (e.clientY < 60) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 60) window.scrollBy(0, 14);
});
function endDrag(){
  if (!drag) return;
  const {item, list, ph, oldStyle, pid} = drag;
  drag = null;
  if (ph.parentNode === list) list.insertBefore(item, ph);
  ph.remove();
  if (oldStyle === null) item.removeAttribute('style'); else item.setAttribute('style', oldStyle);
  item.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  const order = [...list.children].map(c => c.dataset.pid).filter(Boolean);
  reorderPlayers(order, pid, false);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.grip'); if (!g) return;
  const d = {ArrowUp:-1, ArrowLeft:-1, ArrowDown:1, ArrowRight:1}[e.key]; if (!d) return;
  e.preventDefault();
  const pid = g.closest('[data-pid]')?.dataset.pid; const ids = S.players.map(p => p.id);
  const i = ids.indexOf(pid), j = i + d; if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  reorderPlayers(ids, pid, true);
});
function reorderPlayers(order, focusPid, refocus){
  if (order.join('|') === S.players.map(p => p.id).join('|')) return;
  if (S.phase !== 'lobby') snapshot();
  const curId = S.phase === 'play' ? curPlayer()?.id : null;
  const map = new Map(S.players.map(p => [p.id, p]));
  const next = order.map(id => map.get(id)).filter(Boolean);
  S.players.forEach(p => { if (!next.includes(p)) next.push(p); });
  S.players = next;
  if (curId) S.cur = Math.max(0, S.players.findIndex(p => p.id === curId));
  save(); SFX.card();
  if (S.phase === 'lobby') softLobby();
  else if (S.phase === 'play' && !modalOpen) render();
  else softRail();
  const el = document.querySelector(`[data-pid="${CSS.escape(focusPid)}"]`);
  if (el){ el.classList.remove('joined'); void el.offsetWidth; el.classList.add('joined'); if (refocus) el.querySelector('.grip')?.focus(); }
}

/* ================= live multiplayer (room) ================= */
let roomP = null, roomAvailable = false, roomTried = false, hostRoom = null, phoneConn = {}, keeperCount = 0, lastJoined = null;
let MODE = 'home';
const IDKEY = 'chainReaction.me';
const PL = {code:'', pid:null, name:'', emoji:'', keeper:false, room:null, unsub:null, H:null, hostAt:0, lastEv:0, status:'idle', buzzCool:0, key:'', wasMine:false};
const JF = {code:'', name:'', emoji:rand(EMOJIS), keeper:false};
const seen = {}, pendingAsk = {};
let autoJoin = null;
function myPid(){ let id = lsGet(IDKEY); if (!id || !/^[a-z0-9]{6,16}$/.test(id)){ id = (uid() + uid()).slice(0, 12); lsSet(IDKEY, id); } return id; }
function savedPlayer(){ try { return JSON.parse(lsGet(PKEY)) || null; } catch(e){ return null; } }

/* Live rooms over the game server's WebSocket. Same shape as before:
   join(name) -> room with presence(patch), onPeers(fn), peers(), leave(). */
function createLiveService(){
  return new Promise(resolve => {
    if (!('WebSocket' in window) || location.protocol === 'file:') return resolve(null);
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    const rooms = new Map();
    let ws = null, open = false, myId = null, settled = false, retry = 0;
    const send = o => { if (open && ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
    const mkPeer = (id, presence) => Object.freeze({peer:id, presence:Object.freeze(presence || {}), updatedAt:Date.now(), isMe:id === myId, sameTab:id === myId});
    const emitPeers = r => { const arr = [...r.peers.values()]; r.handlers.forEach(h => { try { h({peers:arr}); } catch(e){ console.error(e); } }); };
    const api = {
      join(name){
        if (rooms.has(name)) return Promise.resolve(rooms.get(name).api);
        const r = {peers:new Map(), handlers:new Set(), my:{}};
        r.api = {
          name,
          presence(patch){
            for (const [k, v] of Object.entries(patch || {})){ if (v === null) delete r.my[k]; else r.my[k] = v; }
            send({t:'presence', room:name, patch}); return Promise.resolve();
          },
          onPeers(fn){ r.handlers.add(fn); setTimeout(() => { if (r.handlers.has(fn)) fn({peers:[...r.peers.values()]}); }, 0); return () => r.handlers.delete(fn); },
          peers(){ return [...r.peers.values()]; },
          leave(){ rooms.delete(name); send({t:'leave', room:name}); return Promise.resolve(); }
        };
        rooms.set(name, r); send({t:'join', room:name});
        return Promise.resolve(r.api);
      }
    };
    function connect(){
      try { ws = new WebSocket(url); } catch(e){ if (!settled){ settled = true; resolve(null); } return; }
      ws.onopen = () => {
        open = true; retry = 0;
        for (const [name, r] of rooms){ r.peers.clear(); send({t:'join', room:name}); if (Object.keys(r.my).length) send({t:'presence', room:name, patch:r.my}); }
        if (!settled){ settled = true; resolve(api); }
      };
      ws.onmessage = e => {
        let m; try { m = JSON.parse(e.data); } catch(_){ return; }
        if (m.t === 'hello'){ myId = m.id; return; }
        const r = rooms.get(m.room); if (!r) return;
        if (m.t === 'snapshot'){ r.peers = new Map(m.peers.map(p => [p.id, mkPeer(p.id, p.presence)])); emitPeers(r); }
        else if (m.t === 'peer'){ const old = r.peers.get(m.id); if (!old || JSON.stringify(old.presence) !== JSON.stringify(m.presence)){ r.peers.set(m.id, mkPeer(m.id, m.presence)); emitPeers(r); } }
        else if (m.t === 'left'){ if (r.peers.delete(m.id)) emitPeers(r); }
      };
      ws.onclose = () => { open = false; setTimeout(connect, Math.min(10000, 1000 * 2 ** retry++)); };
      ws.onerror = () => {};
    }
    connect();
    setTimeout(() => { if (!settled){ settled = true; resolve(null); } }, 8000);
  });
}
function initRoom(){
  roomP = createLiveService();
  roomP.then(r => {
    roomAvailable = !!r; roomTried = true;
    if (!r){ render(); return; }
    if (MODE === 'host') hostConnect();
    if (autoJoin){ const a = autoJoin; autoJoin = null; joinAsPlayer(a.code, a.name, a.emoji, a.keeper); }
    else if (MODE === 'home') render();
  }).catch(() => { roomTried = true; render(); });
}
async function hostConnect(){
  const r = await roomP;
  if (!r || !S.code){ render(); return; }
  const name = 'chain-' + S.code.toLowerCase();
  if (hostRoom && hostRoom.name === name){ broadcast(); return; }
  try {
    hostRoom = await r.join(name);
    hostRoom.onPeers(onHostPeers);
    broadcast(); render();
  } catch(e){ hostRoom = null; render(); }
}
function compactState(){
  const rd = S.phase === 'lobby' ? null : curRound();
  const g = {
    ph:S.phase, rn: rd ? rd.name : '', ri:S.ri, rt:S.roundList.length, ic: rd ? rd.icon : '', rid: rd ? rd.id : '',
    th: rd && rd.id === 'theme' ? S.theme : '', cur: S.phase==='play' ? (curPlayer()?.id || null) : null,
    nxt: S.phase==='play' ? (nextPlayer()?.id || null) : null, cl:S.chain.length, rec:S.record.len,
    pz: S.paused ? 1 : 0, fin: S.finalists, champ: S.champion, kk: (S.kicked || []).slice(-30),
    pl: S.players.map(p => [p.id, p.name, p.emoji, p.color, p.score||0, p.rs||0, p.judge?1:0, p.out?1:0, p.card||'', p.cardUsed?1:0, p.ts||0]),
    ev: S.ev, w: S.chain.map(c => [c.w.slice(0,30), (c.g||'').slice(0,24)])
  };
  while (JSON.stringify(g).length > 3600 && g.w.length){ g.w = g.w.slice(1); g.wo = (g.wo||0) + 1; }
  return g;
}
function broadcast(){
  if (!hostRoom || MODE !== 'host') return;
  hostRoom.presence({role:'host', code:S.code, g:compactState()}).catch(()=>{});
}
// light heartbeat: keeps phones in sync and the free server awake
setInterval(() => { if (hostRoom && MODE === 'host') broadcast(); }, 10000);

function uniqueName(name, selfId){
  const taken = new Set(S.players.filter(p => p.id !== selfId).map(p => p.name.toLowerCase()));
  if (!taken.has(name.toLowerCase())) return name;
  for (let i = 2; i < 99; i++){ const n = `${name} ${i}`; if (!taken.has(n.toLowerCase())) return n; }
  return name;
}
const nextColor = () => COLORS[S.players.length % COLORS.length];
function onHostPeers(ch){
  const conn = {}, players = []; let keepers = 0;
  for (const pr of ch.peers){
    const pz = pr.presence || {};
    if (pz.code !== S.code) continue;
    if (pz.role === 'keeper'){ keepers++; continue; }
    if (pz.role !== 'player' || typeof pz.pid !== 'string' || !/^[a-z0-9]{6,16}$/.test(pz.pid)) continue;
    conn[pz.pid] = true; players.push(pz);
    const st = seen[pr.peer];
    if (!st){ seen[pr.peer] = {buzz: pz.buzz || 0, req: pz.req?.ts || 0}; continue; }
    if (pz.buzz && pz.buzz !== st.buzz){ st.buzz = pz.buzz; onBuzz(pz.pid); }
    if (pz.req && pz.req.ts !== st.req){ st.req = pz.req.ts; onCardReq(pz.pid); }
  }
  phoneConn = conn; keeperCount = keepers;
  reconcilePlayers(players);
  if (MODE !== 'host') return;
  if (S.phase === 'lobby') softLobby();
  else {
    const c = $('#connCount'); if (c) c.textContent = Object.keys(conn).length;
    if (S.phase === 'play') softRail();
  }
}
function reconcilePlayers(list){
  let changed = false;
  for (const pz of list){
    if ((S.kicked || []).includes(pz.pid)) continue;
    const name = clean(pz.name).slice(0, 20); if (!name) continue;
    const emoji = EMOJIS.includes(pz.emoji) ? pz.emoji : null;
    const p = byId(pz.pid);
    if (S.phase === 'lobby'){
      if (!p){
        S.players.push({id:pz.pid, name:uniqueName(name, pz.pid), emoji: emoji || rand(EMOJIS), color: nextColor()});
        lastJoined = pz.pid; changed = true; SFX.card();
      } else {
        const want = uniqueName(name, p.id);
        if (p.name !== want){ p.name = want; changed = true; }
        if (emoji && p.emoji !== emoji){ p.emoji = emoji; changed = true; }
      }
    } else if (!p && !pendingAsk[pz.pid]){
      pendingAsk[pz.pid] = true; setTimeout(() => { delete pendingAsk[pz.pid]; }, 60000);
      SFX.buzz();
      toast(`👋 <b>${esc(emoji || '')} ${esc(name)}</b> wants to join the game`, [['Add them', () => addLate(pz.pid, name, emoji), 'pop'], ['Not now', () => {}, 'ghost']], 15000);
    }
  }
  if (changed) save();
}
function addLate(pid, name, emoji){
  if (byId(pid)) return;
  S.players.push({id:pid, name:uniqueName(name, pid), emoji: emoji || rand(EMOJIS), color: nextColor(),
    score:0, ts:0, rs:0, judge:false, out:false, catches:0, succ:0, card:rand(Object.keys(CARDS)), cardUsed:false});
  setEv('join', `${name} joined the game`);
  save(); if (modalOpen) softRail(); else render();
  toast(`${esc(name)} is in! They’ll take turns from the next lap.`);
}
function softRail(){ if (drag) return; const ol = document.querySelector('.rail .plist'); if (ol) ol.innerHTML = S.players.map(chip).join(''); }
function onBuzz(pid){
  const p = byId(pid); if (!p || S.phase !== 'play') return;
  SFX.buzz();
  toast(`🚨 <b>${p.emoji} ${esc(p.name)}</b> caught a mistake!`, [['Give a strike', () => openStrike('missed', p.id), 'danger'], ['Ignore', () => {}, 'ghost']], 9000);
}
function onCardReq(pid){
  const p = byId(pid); if (!p || p.cardUsed) return;
  const c = CARDS[p.card];
  SFX.card();
  toast(`${c.icon} <b>${esc(p.name)}</b> wants to play <b>${c.name}</b>`, [['Play it', () => openCard(p.id), 'pop'], ['Not now', () => {}, 'ghost']], 10000);
}

/* ----- phone side ----- */
async function joinAsPlayer(code, name, emoji, keeper){
  code = clean(code).toUpperCase(); name = clean(name).slice(0, 20);
  const err = m => { const je = $('#joinErr'); if (je) je.textContent = m; else toast(esc(m)); };
  if (!/^[A-Z0-9]{4}$/.test(code)) return err('Enter the 4-character room code from the host’s screen.');
  if (!name){ $('#joinName')?.focus(); return err('Type your name so everyone knows who you are.'); }
  if (!EMOJIS.includes(emoji)) emoji = rand(EMOJIS);
  const r = await roomP;
  if (!r) return err('Can’t reach the game server. Refresh the page and try again.');
  let room;
  try { room = await r.join('chain-' + code.toLowerCase()); }
  catch(e){ return err('Couldn’t connect. Check your connection and try again.'); }
  if (PL.unsub) PL.unsub();
  if (PL.room && PL.room !== room) PL.room.leave().catch(()=>{});
  Object.assign(PL, {code, name, emoji, keeper:!!keeper, pid:myPid(), room, H:null, status:'finding', lastEv:0, key:'', wasMine:false});
  MODE = 'player';
  room.presence({role: keeper ? 'keeper' : 'player', code, pid:PL.pid, name, emoji}).catch(()=>{});
  PL.unsub = room.onPeers(onPlayerPeers);
  lsSet(PKEY, JSON.stringify({code, name, emoji, keeper:!!keeper}));
  try { history.replaceState(null, '', location.pathname + '?join=' + code); } catch(e){}
  setTimeout(() => { if (!PL.H && MODE === 'player' && PL.status === 'finding'){ PL.status = 'nohost'; renderPlayerNow(); } }, 8000);
  render();
}
function onPlayerPeers(ch){
  const hosts = ch.peers.filter(p => p.presence && p.presence.role === 'host' && p.presence.code === PL.code && p.presence.g);
  if (!hosts.length){ if (PL.H){ PL.H = null; PL.status = 'hostgone'; } }
  else {
    const h = hosts.sort((a,b) => b.updatedAt - a.updatedAt)[0];
    PL.H = h.presence.g; PL.hostAt = h.updatedAt; PL.status = 'live';
    const ev = PL.H.ev;
    if (ev && ev.id !== PL.lastEv){
      if (PL.lastEv && ev.x) toast(esc(ev.x), [], 4000);
      PL.lastEv = ev.id;
    }
  }
  const key = JSON.stringify([PL.status, PL.H]);
  if (key !== PL.key){
    PL.key = key;
    const mine = !!(PL.H && PL.H.ph === 'play' && PL.H.cur === PL.pid);
    if (mine && !PL.wasMine){ if (navigator.vibrate) navigator.vibrate([120,60,120]); SFX.whoosh(); }
    PL.wasMine = mine;
    renderPlayerNow();
  }
}
function renderPlayerNow(){ if (MODE === 'player') $('#app').innerHTML = header() + renderPlayer(); }
function renderPlayer(){
  const H = PL.H, code = esc(PL.code);
  const leave = `<button class="btn ghost" data-act="pLeave">Leave the room</button>`;
  if (!H){
    const msg = PL.status === 'nohost' ? `No room <b>${code}</b> is open yet. Check the code on the host’s screen. This page connects by itself as soon as the room opens.`
      : PL.status === 'hostgone' ? 'The host isn’t connected right now. Hang tight, this page reconnects by itself when they’re back.'
      : `Joining room <b>${code}</b>…`;
    return `<div class="phone"><section class="panel pad status"><div class="big">📡</div><p>${msg}</p></section>${leave}</div>`;
  }
  const pl = H.pl.map(a => ({id:a[0], name:a[1], emoji:a[2], color:a[3], score:a[4], rs:a[5], judge:a[6], out:a[7], card:a[8], used:a[9], ts:a[10]}));
  const cur = pl.find(p => p.id === H.cur), nxt = pl.find(p => p.id === H.nxt);
  const roundLine = H.rn ? `${esc(H.ic)} ${esc(H.rn)}${H.th ? `: <b>${esc(H.th)}</b>` : ''}` : '';
  const phaseMsg = {lobby:'Waiting for the host to start the game.', intro:'Get ready, the round is about to start!', finaleIntro:'The grand finale is about to begin!', roundEnd:'Round complete! Check the big screen.', awards:'Game over! Awards are on the big screen.'}[H.ph] || '';
  const ranked = [...pl].sort((a,b) => b.score - a.score || a.ts - b.ts || a.name.localeCompare(b.name));
  const youTag = p => p.id === PL.pid ? '<span class="you-tag">you</span>' : '';
  const board = `<section class="panel pad"><h2 style="font-size:1.2rem;margin-bottom:10px">Scoreboard</h2><ol class="board">${ranked.map((p,i) => `<li><span class="rk">${i+1}</span><span class="ava" style="--c:${esc(p.color)}">${esc(p.emoji)}</span><span class="nm">${esc(p.name)}${youTag(p)}</span><span class="pts">${p.score}</span></li>`).join('')}</ol></section>`;
  const roomList = `<section class="panel pad"><h2 style="font-size:1.2rem;margin-bottom:10px">In the room (${pl.length})</h2>${pl.length ? `<ul class="roster">${pl.map(p => `<li><span class="ava" style="--c:${esc(p.color)}">${esc(p.emoji)}</span><span class="nm"><span>${esc(p.name)}${youTag(p)}</span></span></li>`).join('')}</ul>` : '<p class="muted">Nobody yet.</p>'}</section>`;

  if (PL.keeper){
    const ws = H.w || [];
    return `<div class="phone">
      <section class="panel pad status"><div class="muted">${roundLine}</div><div class="big">🔑 Chain Keeper</div>
      ${cur ? `<p>${esc(cur.emoji)} <b>${esc(cur.name)}</b> is reciting ${H.cl} word${H.cl===1?'':'s'}</p>` : `<p>${phaseMsg}</p>`}</section>
      ${H.ph === 'lobby' ? roomList : `<section class="panel pad"><h2 style="font-size:1.2rem">The chain</h2>
      ${H.wo ? `<p class="muted">${H.wo} earlier words not shown</p>` : ''}
      ${ws.length ? `<ol class="keeper-list" style="counter-reset:w ${H.wo||0}">${ws.map((w,i) => `<li class="${i===ws.length-1?'last':''}">${esc(w[0])}${w[1] ? ` <span class="g">(${esc(w[1])})</span>` : ''}</li>`).join('')}</ol>` : '<p class="muted">No words yet. A fresh chain is starting.</p>'}
      </section>`}
      ${leave}</div>`;
  }
  const me = pl.find(p => p.id === PL.pid);
  if (!me){
    const kicked = (H.kk || []).includes(PL.pid);
    const msg = kicked ? 'The host removed you from this room.' : H.ph === 'lobby' ? 'Joining the room…' : 'The game has already started. The host has been asked to add you.';
    return `<div class="phone"><section class="panel pad status"><div class="big">${kicked ? '🚪' : '⏳'}</div><p>${msg}</p></section>${H.ph === 'lobby' ? roomList : board}${leave}</div>`;
  }
  if (H.ph === 'lobby'){
    return `<div class="phone">
      <section class="panel pad status soon">${mascot('happy')}<div class="big">You’re in! 🎉</div><span class="ava" style="--c:${esc(me.color)}">${esc(me.emoji)}</span><p><b>${esc(me.name)}</b>, the host will start the game soon. Keep this screen open.</p></section>
      ${roomList}${leave}</div>`;
  }
  const rank = ranked.findIndex(p => p.id === me.id) + 1;
  const fin = H.rid === 'finale';
  const mine = H.ph === 'play' && H.cur === me.id, soon = H.ph === 'play' && H.nxt === me.id;
  let status;
  if (H.ph === 'awards') status = `<section class="panel pad status ${rank === 1 ? 'mine' : rank <= 3 ? 'soon' : ''}">${mascot(rank <= 3 ? 'happy' : 'idle')}<div class="big">${rank === 1 ? '👑 You won!' : `You finished #${rank}`}</div><p>${rank === 1 ? 'Champion of Chain Reaction!' : `out of ${pl.length} players`} with <b>${me.score} point${Math.abs(me.score) === 1 ? '' : 's'}</b>.</p></section>`;
  else if (H.ph !== 'play') status = `<section class="panel pad status"><div class="muted">${roundLine}</div><div class="big">${esc(me.emoji)}</div><p>${phaseMsg}</p></section>`;
  else if (mine) status = `<section class="panel pad status mine"><div>${roundLine}</div><div class="big">Your turn! 🎤</div><p>Say all <b>${H.cl}</b> word${H.cl===1?'':'s'}, then add one.</p></section>`;
  else status = `<section class="panel pad status ${soon?'soon':''}"><div class="muted" ${soon?'style="color:inherit"':''}>${roundLine}</div>
    ${cur ? `<span class="ava" style="--c:${esc(cur.color)}">${esc(cur.emoji)}</span><div class="big">${esc(cur.name)}</div><p>is up with <b>${H.cl}</b> word${H.cl===1?'':'s'} to recite</p>` : ''}
    ${soon ? '<p><b>You’re next. Get ready!</b></p>' : ''}
    ${(fin && me.out) ? '<p><b>You’re out of the finale. Cheer them on!</b></p>' : me.judge ? '<p><b>⚖️ You’re a Chain Judge this round. Listen for mistakes!</b></p>' : ''}
    </section>`;
  const c = CARDS[me.card];
  const canBuzz = H.ph === 'play' && !mine;
  return `<div class="phone">
    ${status}
    <div class="mystats"><div class="stat"><b>${me.score}</b><span>Points</span></div><div class="stat"><b>#${rank}</b><span>Rank</span></div><div class="stat"><b>${me.ts}</b><span>Strikes</span></div></div>
    <button class="btn danger huge" data-act="pBuzz" ${canBuzz && PL.buzzCool < Date.now() ? '' : 'disabled'}>🚨 I caught a mistake!</button>
    ${board}${leave}
  </div>`;
}

/* ================= boot ================= */
(function boot(){
  const jc = new URLSearchParams(location.search).get('join');
  const sp = savedPlayer();
  if (sp){ JF.name = sp.name || ''; if (EMOJIS.includes(sp.emoji)) JF.emoji = sp.emoji; }
  if (jc){
    JF.code = clean(jc).toUpperCase().slice(0, 4); JF.invited = true;
    if (sp && sp.code === JF.code && sp.name) autoJoin = {code:JF.code, name:sp.name, emoji:sp.emoji, keeper:false};
  } else if (S.phase !== 'home' && S.code){
    MODE = 'host';
  }
  render();
  initRoom();
  requestAnimationFrame(loop);
})();
</script>
